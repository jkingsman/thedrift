# The Drift — nginx config
# NOTE: After first deploy, certbot modifies the server copy.
# Don't blindly cp this over the live config — it will overwrite cert paths.
# Use this as a reference for fresh installs only.
#
# REQUIRED in your nginx.conf http{} block:
#   limit_req_zone $binary_remote_addr zone=drift_actions:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name thedrift.nexus;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thedrift.nexus;

    ssl_certificate /etc/letsencrypt/live/thedrift.nexus/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thedrift.nexus/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=drift_actions burst=10 nodelay;
        limit_req_status 429;
    }
}
